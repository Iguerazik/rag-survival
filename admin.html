<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>RAG SURVIVAL · Painel</title>
<style>
@font-face{font-family:Cinzel;font-weight:700;src:url(assets/fonts/cinzel-latin-700-normal.woff2) format('woff2')}
:root{color-scheme:dark;--bg:#14110d;--panel:#211b14;--line:#3d3226;--gold:#e8c46a;--txt:#efe6d4;--dim:#a8997f;--ok:#7fd17f;--warn:#e8b25a;--bad:#e46b5f}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,#3a2b19,var(--bg) 60%);color:var(--txt);font:14px/1.45 system-ui,Segoe UI,sans-serif;min-height:100vh}
main{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
h1{font-family:Cinzel,serif;color:var(--gold);letter-spacing:.06em;margin:0 0 4px;font-size:26px}
h2{font-family:Cinzel,serif;color:var(--gold);font-size:16px;letter-spacing:.05em;margin:26px 0 8px}
.sub{color:var(--dim);margin:0 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.login{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{flex:1;min-width:220px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:#0f0c09;color:var(--txt);font-size:14px}
button{padding:9px 14px;border-radius:8px;border:1px solid #6d5631;background:linear-gradient(#5b4422,#3b2c16);color:#fbe9bd;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border-color:var(--line);color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:24px;color:var(--gold);font-family:Cinzel,serif}
.stat span{color:var(--dim);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;background:#1a150f}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:12px;border:1px solid var(--line);white-space:nowrap}
.menu{color:var(--dim)} .solo,.pause{color:#9fc8ff;border-color:#33506f} .online{color:var(--ok);border-color:#2f5a32} .ended{color:var(--warn)}
.empty{color:var(--dim);padding:14px;text-align:center}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:10px}
.err{color:var(--bad)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--ok)} .dot.off{background:var(--bad)}
</style>
</head>
<body>
<main>
  <h1>RAG SURVIVAL · Painel</h1>
  <p class="sub">Quem está com o jogo aberto agora e as salas do multiplayer. Atualiza a cada 5 segundos.</p>

  <section class="card" id="login">
    <div class="login">
      <input id="token" type="password" autocomplete="off" placeholder="Cole a ADMIN_TOKEN (fica só nesta aba)">
      <button id="enter">Entrar</button>
    </div>
    <p class="err" id="login-err" hidden></p>
  </section>

  <section id="panel" hidden>
    <div class="stats" id="stats"></div>
    <h2>Jogadores com o jogo aberto</h2>
    <table><thead><tr><th>Jogador</th><th>Onde</th><th>Mapa</th><th>Classe · Nível</th><th>Há quanto tempo</th></tr></thead><tbody id="people"></tbody></table>
    <h2>Salas do multiplayer</h2>
    <table><thead><tr><th>Sala</th><th>Estado</th><th>Mapa</th><th>Membros</th></tr></thead><tbody id="rooms"></tbody></table>
    <div class="bar"><span id="updated">—</span><span><button class="ghost" id="logout">Sair</button></span></div>
  </section>
</main>
<script>
'use strict';
const MAPS={sewer:'Esgotos de Prontera',payon:'Caverna de Payon',maze:'Labirinto da Floresta',orc:'Calabouço dos Orcs',geffen:'Torre de Geffen',
  payonfield:'Floresta de Payon',glast:'Prisão de Glast Heim',mine:'Mina Abandonada',temple:'Templo Esquecido',shadow:'Bosque das Sombras'};
const MODES={menu:'No menu',solo:'Jogando solo',pause:'Solo (pausado)',online:'Jogando online',ended:'Fim da partida'};
const PHASES={lobby:'No lobby',playing:'Em partida',ended:'Fim da partida'};
const JOBS={sword:'Espadachim',mage:'Mago',archer:'Arqueiro'};
const DIFF={easy:'Fácil',normal:'Normal',hard:'Difícil',nightmare:'Pesadelo'};
const job=v=>JOBS[v]||v||'',diff=v=>DIFF[v]||v||'';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dur=s=>{s=Math.max(0,s|0);if(s<60)return s+' s';const m=Math.floor(s/60);if(m<60)return m+' min';return Math.floor(m/60)+' h '+(m%60)+' min';};
const clock=s=>s==null?'':Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
let token='',timer=0;
try{token=sessionStorage.getItem('rag-admin')||'';}catch{}
async function load(){
  try{
    const r=await fetch('/api/admin/online',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
    if(r.status===401||r.status===404){logout(r.status===404?'O painel está desligado neste servidor (sem ADMIN_TOKEN).':'Chave inválida.');return;}
    if(!r.ok)throw new Error('HTTP '+r.status);
    render(await r.json());
  }catch(e){$('updated').innerHTML='<span class="err">Sem resposta do servidor ('+esc(e.message)+'). Tentando de novo…</span>';}
}
function render(d){
  $('login').hidden=true;$('panel').hidden=false;
  const t=d.totals,tick=d.server.tick||{};
  $('stats').innerHTML=[
    [t.open,'com o jogo aberto'],[t.accounts,'com conta'],[t.guests,'convidados'],[t.solo,'jogando solo'],[t.online,'jogando online'],[t.rooms,'salas abertas'],
    [(tick.measuredTps??'—'),'TPS do servidor'+(tick.p99Ms!=null?' · p99 '+tick.p99Ms+' ms':'')],[d.server.memoryMb+' MB','memória · ligado há '+dur(d.server.uptime)]
  ].map(([v,l])=>'<div class="stat"><b>'+esc(v)+'</b><span>'+esc(l)+'</span></div>').join('');
  $('people').innerHTML=d.people.length?d.people.map(p=>'<tr><td>'+esc(p.name)+(p.account?' <span class="tag">conta: '+esc(p.username)+'</span>':' <span class="tag menu">sem conta</span>')+'</td>'+
    '<td><span class="tag '+esc(p.mode)+'">'+esc(MODES[p.mode]||p.mode)+'</span></td><td>'+esc(p.map?(MAPS[p.map]||p.map)+(p.difficulty?' · '+diff(p.difficulty):''):'—')+'</td>'+
    '<td>'+esc(p.line?job(p.line)+(p.level!=null?' · nível '+p.level:''):'—')+'</td><td>'+dur(p.sinceSec)+(p.lastSec>30?' <span class="err">(sem sinal há '+p.lastSec+' s)</span>':'')+'</td></tr>').join('')
    :'<tr><td colspan="5" class="empty">Ninguém com o jogo aberto agora.</td></tr>';
  $('rooms').innerHTML=d.rooms.length?d.rooms.map(r=>'<tr><td><b>'+esc(r.code)+'</b></td><td>'+esc(PHASES[r.phase]||r.phase)+(r.time!=null?' · '+clock(r.time)+(r.endless?' · ∞':''):'')+'</td>'+
    '<td>'+esc(r.map?(MAPS[r.map]||r.map)+(r.difficulty?' · '+diff(r.difficulty):''):'—')+'</td><td>'+(r.members.map(m=>'<div><span class="dot'+(m.connected?'':' off')+'" title="'+(m.connected?'Conectado':'Sem conexão no momento')+'"></span>'+esc(m.name)+(m.host?' ★':'')+
      ' <span style="color:var(--dim)">'+esc(job(m.job))+(m.level!=null?' · nív. '+m.level:'')+(m.alive===false?' · caído':'')+(m.account?'':' · convidado')+'</span></div>').join('')||'—')+'</td></tr>').join('')
    :'<tr><td colspan="4" class="empty">Nenhuma sala aberta.</td></tr>';
  $('updated').textContent='Atualizado às '+new Date(d.at).toLocaleTimeString('pt-BR');
}
function start(){clearInterval(timer);load();timer=setInterval(load,5000);}
function logout(msg){clearInterval(timer);token='';try{sessionStorage.removeItem('rag-admin');}catch{}$('panel').hidden=true;$('login').hidden=false;
  const e=$('login-err');e.hidden=!msg;e.textContent=msg||'';}
$('enter').onclick=()=>{token=$('token').value.trim();$('token').value='';if(!token)return;try{sessionStorage.setItem('rag-admin',token);}catch{}start();};
$('token').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click();});
$('logout').onclick=()=>logout('');
if(token)start();
</script>
</body>
</html>
