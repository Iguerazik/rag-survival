services:
  rag-survival:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      NODE_ENV: production
      DATA_DIR: /data
      TICK_RATE: ${TICK_RATE:-60}
      SNAPSHOT_RATE: ${SNAPSHOT_RATE:-20}
      REQUIRE_HTTPS: ${REQUIRE_HTTPS:-0}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      MAX_ROOMS: ${MAX_ROOMS:-150}
      STRICT_ONLINE_PROGRESS: ${STRICT_ONLINE_PROGRESS:-1}
    volumes:
      - midgard-accounts:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3

volumes:
  midgard-accounts:
